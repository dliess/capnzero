[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "capnzero-runtime"
version = "0.1.0"
description = "ZeroMQ and Cap'n Proto runtime for generated CapnZero Python clients and servers"
requires-python = ">=3.10"
dependencies = ["pycapnp>=2.2,<3", "pyzmq>=27,<28"]

[tool.setuptools.packages.find]
where = ["."]
include = ["capnzero*"]
